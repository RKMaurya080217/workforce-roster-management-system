# Test properties for Weekly Roster Management System (Batch 105 Isolated Replica DB)
spring.application.name=Weekly Roster Management System Test
spring.datasource.url=jdbc:sqlite:target/test-wrms.db?busy_timeout=30000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=30000;
spring.datasource.hikari.pool-name=WRMSTestSqlitePool

app.jwt.secret=test-secret-key-for-unit-and-scenario-tests-1234567890
email.provider=BREVO
brevo.api.key=TEST_MOCK_KEY
brevo.sender.email=rajatkumarmaury@gmail.com
brevo.sender.name=WRMS

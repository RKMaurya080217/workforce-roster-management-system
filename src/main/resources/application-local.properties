# ==============================================================================
# WRMS Local Profile — SQLite Configuration (Batch 73)
# Database file: data/wrms.db
# ==============================================================================

spring.datasource.url=jdbc:sqlite:data/wrms.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# Hibernate / JPA SQLite Community Dialect & Schema Strategy
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Configuration for SQLite File Database (Single-writer concurrency safety)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.pool-name=WRMSSqlitePool

# ==============================================================================
# WRMS Production / Railway Profile — MySQL Configuration (Batch 73)
# Preserves existing Railway MySQL environment, variables, and behavior intact
# ==============================================================================

# Railway & Cloud MySQL Resolution with Local Fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${JDBC_DATABASE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:${DB_HOST:localhost}}}:${MYSQLPORT:${MYSQL_PORT:${DB_PORT:3306}}}/${MYSQLDATABASE:${MYSQL_DATABASE:${DB_NAME:weekly_roster_db}}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:${MYSQL_USERNAME:${DB_USERNAME:${DB_USER:${DATABASE_USERNAME:root}}}}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD:${DB_PASSWORD:${DB_PASS:${DATABASE_PASSWORD:root}}}}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Dialect & Persistence Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# HikariCP Connection Pool Settings for Cloud & Railway Resiliency
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:6}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.pool-name=WRMSHikariPool
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD:60000}

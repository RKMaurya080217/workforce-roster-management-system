spring.application.name=Weekly Roster Management System
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weekly_roster_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Character Encoding & UTF-8 Enforcement
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-change-this-secret-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.shift-capacity.morning=${SHIFT_CAPACITY_MORNING:2}
app.shift-capacity.general=${SHIFT_CAPACITY_GENERAL:2}
app.shift-capacity.evening=${SHIFT_CAPACITY_EVENING:2}
app.shift-capacity.night=${SHIFT_CAPACITY_NIGHT:1}

# Automatic Sunday Roster Generation & Email Distribution
roster.auto-generation.enabled=${ROSTER_AUTO_GEN_ENABLED:true}
roster.auto-generation.cron=${ROSTER_AUTO_GEN_CRON:0 0 9 * * SUN}
roster.auto-generation.timezone=${ROSTER_AUTO_GEN_TIMEZONE:Asia/Kolkata}
roster.auto-email.enabled=${ROSTER_AUTO_EMAIL_ENABLED:true}

# Gmail SMTP Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:rajatkumarmaury@gmail.com}}
spring.mail.password=${MAIL_APP_PASSWORD:${SPRING_MAIL_PASSWORD:grqb vbjj wlux lapt}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.swagger-ui.path=/swagger-ui.html

# Graceful Shutdown & Socket Release
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

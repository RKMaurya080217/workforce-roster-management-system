spring.application.name=Weekly Roster Management System
server.port=${PORT:${SERVER_PORT:8080}}

# Railway & Cloud MySQL Resolution with Local Fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${JDBC_DATABASE_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:${DB_HOST:localhost}}}:${MYSQLPORT:${MYSQL_PORT:${DB_PORT:3306}}}/${MYSQLDATABASE:${MYSQL_DATABASE:${DB_NAME:weekly_roster_db}}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:${DB_USERNAME:root}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:${DB_PASSWORD:root}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings for Cloud & Railway Resiliency
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.pool-name=WRMSHikariPool

# Character Encoding & UTF-8 Enforcement
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-change-this-secret-in-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.shift-capacity.morning=${SHIFT_CAPACITY_MORNING:2}
app.shift-capacity.general=${SHIFT_CAPACITY_GENERAL:2}
app.shift-capacity.evening=${SHIFT_CAPACITY_EVENING:2}
app.shift-capacity.night=${SHIFT_CAPACITY_NIGHT:1}

# Automatic Sunday Roster Generation & Email Distribution
roster.auto-generation.enabled=${ROSTER_AUTO_GEN_ENABLED:true}
roster.auto-generation.cron=${ROSTER_AUTO_GEN_CRON:0 0 9 * * SUN}
roster.auto-generation.timezone=${ROSTER_AUTO_GEN_TIMEZONE:Asia/Kolkata}
roster.auto-email.enabled=${ROSTER_AUTO_EMAIL_ENABLED:true}

# ==============================================================================
# Transactional Email Provider (Primary: Brevo HTTPS REST API | Fallback: SMTP)
# ==============================================================================
email.provider=${EMAIL_PROVIDER:BREVO}

# Brevo HTTPS Transactional Email API (Primary for Railway Trial/Hobby)
brevo.api.key=${BREVO_API_KEY:}
brevo.api.base-url=${BREVO_API_BASE_URL:https://api.brevo.com}
brevo.api.url=${BREVO_API_URL:${brevo.api.base-url}/v3/smtp/email}
brevo.sender.email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:rajatkumarmaury@gmail.com}}
brevo.sender.name=${BREVO_SENDER_NAME:WRMS}
brevo.reply-to=${BREVO_REPLY_TO:}

# Gmail SMTP Mail Configuration (SMTP Fallback — Retained for Railway Pro / SMTP-capable envs)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:${SMTP_USERNAME:rajatkumarmaury@gmail.com}}}
spring.mail.password=${MAIL_APP_PASSWORD:${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.swagger-ui.path=/swagger-ui.html

# Graceful Shutdown & Socket Release
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
# AWT Server Headless Mode for Railway Image Export
spring.main.headless=true
